name: Refine new issues with Agents API

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number to refine again
        required: true
        type: string

concurrency:
  group: jobmatch-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  triage:
    if: >-
      vars.TRIAGE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.issue.pull_request && github.event.issue.state == 'open' &&
        (github.event_name == 'issues' || github.event.comment.user.type != 'Bot')))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Get structured refinement and publish with the runner
        env:
          OPENAI_API_KEY: ${{ secrets.JOB_MATCH_LAB }}
          TRIAGE_AGENT_ID: ${{ vars.TRIAGE_AGENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/triage-issue.js
