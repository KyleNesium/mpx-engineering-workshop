name: Implement approved issues with Agents API

on:
  issues:
    types: [labeled]

concurrency:
  group: jobmatch-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  generate_patch:
    if: >-
      vars.FACTORY_ENABLED == 'true' && github.event.label.name == 'factory-ready' &&
      github.event.issue.state == 'open' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: write
      issues: read
      pull-requests: read
    outputs:
      has_patch: ${{ steps.generate.outputs.has_patch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the saved implementation agent in a hosted sandbox
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.JOB_MATCH_LAB }}
          IMPLEMENTATION_AGENT_ID: ${{ vars.IMPLEMENTATION_AGENT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ARTIFACT_DIR: ${{ runner.temp }}/implementation
        run: node scripts/implementation-issue.js generate
      - uses: actions/upload-artifact@v4
        if: steps.generate.outputs.has_patch == 'true'
        with:
          name: implementation-patch
          path: ${{ runner.temp }}/implementation/
          if-no-files-found: error
          retention-days: 7

  validate_patch:
    needs: generate_patch
    if: needs.generate_patch.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: implementation-patch
          path: ${{ runner.temp }}/implementation
      - name: Validate the source patch without publishing credentials
        env:
          FACTORY_ARTIFACT_DIR: ${{ runner.temp }}/implementation
        run: node scripts/implementation-issue.js validate
      - uses: actions/upload-artifact@v4
        with:
          name: validated-implementation
          path: ${{ runner.temp }}/implementation/
          if-no-files-found: error
          retention-days: 7

  open_pr:
    needs: validate_patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: validated-implementation
          path: ${{ runner.temp }}/implementation
      - name: Create a source branch and PR ready for review with the runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_ARTIFACT_DIR: ${{ runner.temp }}/implementation
        run: node scripts/implementation-issue.js publish
